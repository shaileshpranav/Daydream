name: CoreMLImageGen
options:
  bundleIdPrefix: com.shailesh
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    revision: ea2805dc1945be20561c77e5f6d1d9a5a637cda2

targets:
  CoreMLImageGen:
    type: application
    platform: macOS
    sources:
      - App
      - Core
    dependencies:
      - package: StableDiffusion
    settings:
      base:
        # The app is called Daydream. The bundle id and the data folders keep the old
        # CoreMLImageGen name so settings, models and pictures carry over.
        PRODUCT_BUNDLE_IDENTIFIER: com.shailesh.CoreMLImageGen
        PRODUCT_NAME: Daydream
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # App/AppIcon.icon (light and dark); redraw it with tools/icon/make_icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Daydream
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        # Not sandboxed: the app reads model folders anywhere and writes to ~/Pictures.
        ENABLE_APP_SANDBOX: NO
